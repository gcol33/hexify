url: https://gcol33.github.io/hexify/

template:
  bootstrap: 5
  bootswatch: sandstone
  light-switch: true

figures:
  dev: svglite::svglite
  fig.ext: svg
  bg: "#F5F6F8"

navbar:
  structure:
    left: [intro, reference, articles]
    right: [search, github, lightswitch]
  components:
    github:
      icon: fab fa-github
      href: https://github.com/gcol33/hexify
      aria-label: GitHub

reference:
  - title: Core Classes
    desc: S4 classes for grid specification and hexified data
    contents:
      - HexGridInfo-class
      - HexData-class
      - hex_grid
      - hexify
      - hexify_assign

  - title: HexData Methods
    desc: Methods for working with HexData objects
    contents:
      - grid_info
      - cells
      - n_cells
      - as_sf
      - as_tibble.HexData
      - is_hex_grid
      - is_hex_data

  - title: Grid Generation
    desc: Functions for creating hexagonal grids over regions
    contents:
      - grid_rect
      - grid_global
      - cell_to_sf
      - lonlat_to_cell
      - cell_to_lonlat

  - title: Visualization
    desc: Plotting and mapping functions
    contents:
      - hexify_ggplot
      - hexify_map
      - hexify_heatmap
      - plot_world
      - hexify_world

  - title: Grid Statistics
    desc: Resolution comparison and grid statistics
    contents:
      - dgearthstat
      - hexify_compare_resolutions
      - hexify_print_resolutions
      - dgverify

  - title: dggridR Compatibility
    desc: Functions for interoperability with dggridR package
    contents:
      - as_dggrid
      - from_dggrid
      - dggrid_is_compatible
      - dggrid_43h_sequence
      - hexify_grid

  - title: Low-Level Coordinate Conversions
    desc: Internal coordinate transformation functions
    contents:
      - starts_with("hexify_lonlat")
      - starts_with("hexify_cell")
      - starts_with("hexify_quad")
      - starts_with("hexify_icosa")
      - starts_with("hexify_index")
      - hexify_forward
      - hexify_forward_to_face
      - hexify_inverse
      - hexify_which_face

  - title: Low-Level Grid Functions
    desc: Internal grid construction and projection functions
    contents:
      - hexify_build_icosa
      - hexify_face_centers
      - hexify_grid_rect
      - hexify_grid_global
      - hexify_grid_to_cell
      - hexify_grid_cell_to_lonlat
      - hex_corners_to_sf
      - hexify_projection_stats

  - title: Resolution & Index Utilities
    desc: Internal resolution and index functions
    contents:
      - dg_closest_res_to_area
      - hexify_area_to_eff_res
      - hexify_eff_res_to_area
      - hexify_eff_res_to_resolution
      - hexify_resolution_to_eff_res
      - hexify_compare_indices
      - hexify_default_index_type
      - hexify_is_valid_index_type

  - title: Hierarchy Functions
    desc: Parent-child cell navigation
    contents:
      - get_parent
      - get_children
      - cell_to_index
      - hexify_get_children
      - hexify_get_parent
      - hexify_get_precision
      - hexify_get_resolution
      - hexify_set_precision
      - hexify_z7_canonical

  - title: Utilities
    desc: Testing and debugging functions
    contents:
      - hexify_roundtrip_test
      - hexify_set_verbose

  - title: Internal
    desc: Internal documentation topics
    contents:
      - hexify-package
      - hexify-conversions
      - hexify-grid
      - hexify-stats
      - starts_with("plot,HexData")
